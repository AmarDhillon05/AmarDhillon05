projects:
  iex:
    title: IEX Order Book & Matching Engine
    stack: [C++17, STL, POSIX, Linux perf]
    dates: Jul 2026 -- Aug 2026
    source: resume/sources/iex_metrics_2026-10.md   # Amar's verbatim metrics, Oct 3 2026
    bullets:
      replay_correctness:
        claim: "C++17 order book + matching engine on the IEX DEEP+ feed. Replayed 50,959,176 (~50.9M, ~51M) real exchange messages through a free-running matching engine with no resync; 99,122 / 99,123 fills exact (one divergence, 37 shares). Share conservation exact across 6,996,617,788 (~7.0B) shares submitted. 100.00% (100%) of shares placed correctly (16,433,036); top-of-book price agreement 100.00% (100%) at every sample, price+size 99.99%"
        core_techs: [C++, IEX]
        optional_techs: [C++17, DEEP+]
        required_numbers: []
      throughput:
        claim: "Sustained 1.26M events/sec end-to-end over the full stream, 8.0 GB peak RSS. At 1.40 GHz base clock: mirror book 485.6 ns/event (2.06M events/sec); authoritative matching engine 686.7 ns/event (1.46M events/sec; ns/event is the per-event average implied by throughput), 1.41x the mirror, for deciding every fill itself"
        core_techs: []
        required_numbers: []
      storage_benchmark:
        claim: "Storage engine with three log-database backends sharing a leaf format. B+ tree vs LSM skip list on identical 2M-record workloads: 25x fewer node hops (17,938 vs 452,434), 42x fewer summary folds, 22x faster range-summarize, 12.8x higher read throughput, page-cache hit rate 69.4% vs 32.9%, for 27% more bytes on disk. Range queries served from node summaries, 2,602 records per node summary vs 62, answering without opening the node"
        core_techs: [B+ tree, LSM]
        required_numbers: []
      adaptive_negative:
        claim: "Measured an adaptive batch-sizing policy and published it as a negative result: +71% disk, +23% hops, -32% append rate, no query win; cost dominated by node lookup, not batch size"
        core_techs: []
        required_numbers: []
      perf_rigor:
        claim: "Hardware counters (perf, 5 runs): IPC 1.85, 55.0% cache miss rate, 2.29 branch misses per 1K instructions, wall time reproducible to +/-0.09%. Top-down: 44.9% retiring, 25.8% frontend-bound, 21.8% backend-bound, 7.5% bad speculation. Diagnosed a 1.65x phantom regression as a CPU-governor artifact (not a code change) by instrumenting a null control book and the timing harness; cut run-to-run variance from ~6% to 0.06% by core pinning and fixing the clock. Reporting harness records CPU, core type, governor and turbo state with every figure and suppresses latency rows whose p50 falls within measured instrument cost"
        core_techs: [perf]
        required_numbers: []

