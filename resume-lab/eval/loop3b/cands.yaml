amazon_contract.leo_deploy:
  incumbent: Co-built a research tool that scores and aggregates topics to show Amazon Leo's public-policy staff what's popular, which runs in dev on AWS Fargate with GitHub Actions CI/CD and AWS CDK infrastructure-as-code ready for production
  candidates:
  - Co-built a topic-scoring research tool and deployed it to dev on AWS Fargate with GitHub Actions CI/CD and AWS CDK to show Amazon Leo's public-policy staff which research topics are popular
amazon_contract.bedrock_finetune:
  incumbent: Built an EventBridge-scheduled LLM-as-judge check for a production Amazon Bedrock classifier that rates research documents by importance to trigger fine-tuning only when its grades shift past a threshold
  candidates:
  - Automated retraining of a production Amazon Bedrock model that rates research documents by importance to run only when a larger LLM's EventBridge-scheduled grades of its output shift past a threshold
capital_one.ui_overhaul:
