base: resume/resume.tex
out: resume/quant_hft.tex
projects_first: true
drop: [capital_one.ui_overhaul, amazon_contract.leo_deploy, amazon_contract.bedrock_finetune, umiacs.env_setup, terplabs.rag_meal]
text:
  iex.replay_correctness: 'Built a C++17 order book and matching engine that replayed \textbf{50.9M} real IEX DEEP+ messages with no resync, matching 99,122 of 99,123 fills exactly and 100\% of top-of-book prices'
  iex.throughput: 'Sustained \textbf{1.26M events/sec} end-to-end, averaging 686.7 ns/event with the CPU fixed at its 1.40 GHz base clock; full matching takes 1.41$\times$ the time of a mirror-only book'
  iex.storage_benchmark: 'Benchmarked B+ tree vs LSM skip-list stores for the replay''s event log on 2M-record workloads (B+ tree: 12.8$\times$ read throughput for 27\% more disk); documented adaptive batch sizing as a negative result'
add_after:
  iex.replay_correctness:
    - fact: iex.data_structures+iex.latency_dist
      text: 'Indexed orders in a hash map holding iterators into per-price FIFO queues (std::map levels, O(1) cancels); 120 ns p50 and 1.2 \textmu{}s p99 per message on a 2M-event run'
  iex.throughput:
    - fact: iex.perf_rigor
      text: 'Traced a 1.65$\times$ phantom regression to a CPU-governor artifact using perf counters and a null control book; core pinning and a fixed clock cut run-to-run variance from $\sim$6\% to 0.06\%'
order:
  iex: [iex.replay_correctness, iex.data_structures+iex.latency_dist, iex.throughput, iex.perf_rigor, iex.storage_benchmark]
retag:
  iex.storage_benchmark: iex.storage_benchmark+iex.adaptive_negative
skills:
  - '\textbf{Languages:} C++17, C, Python, Java, SQL, TypeScript'
  - '\textbf{Systems \& Performance:} Linux perf (hardware counters, top-down analysis), POSIX, STL, B+ trees, LSM trees'
  - '\textbf{Cloud \& Tools:} AWS (Lambda, Kinesis, Fargate, CDK, CloudWatch), Redis, PostgreSQL, Docker, GitHub Actions, Pytest'
  - '\textbf{Certification:} \href{https://www.credly.com/badges/d2406a97-d937-47de-823b-724981159d3b/public_url}{\underline{AWS Certified Developer -- Associate}} (Nov 2024 -- Nov 2027)'
