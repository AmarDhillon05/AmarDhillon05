base: resume/resume.tex
out: resume/backend_cloud.tex
order:
  capital_one: [capital_one.search_index, capital_one.claude_skill, capital_one.ui_overhaul]
  amazon_contract: [amazon_contract.kinesis_pipeline, amazon_contract.leo_deploy, amazon_contract.bedrock_finetune]
drop: [terplabs.rag_meal, umiacs.grasp_vlm]
text:
  amazon_contract.kinesis_pipeline: 'Reduced end-to-end latency \textbf{34\%} for a pipeline routing 6,000+ scraped research documents to inference by replacing scraper-to-S3-to-Lambda staging with Kinesis streams into Lambda'
  amazon_contract.bedrock_finetune: 'Automated EventBridge-scheduled fine-tuning of a Bedrock document-importance classifier that skips redundant retraining runs unless a larger LLM''s eval scores move past a threshold'
  aws_sde.redshift: 'Writing Java policies that tune upper/lower bounds on EC2 capacity reserved for Amazon Redshift operations like patching, balancing availability against cost; validated by backtesting'
  capital_one.search_index: 'Precomputed a tree-style search index so workflow search works under strict DB access limits, distilling a 270K+ row PostgreSQL table (Python/SQLAlchemy, Redis cache) into the main search tool of an LLM agent'
  amazon_contract.leo_deploy: 'Shipped a space-research tool to Amazon Leo''s public-policy team with AWS CDK (TypeScript) IaC and GitHub Actions CI so Leo engineers now maintain it; runs on AWS Fargate (Docker)'
skills:
  - '\textbf{Languages:} Java, Python, C++, TypeScript/JavaScript, SQL'
  - '\textbf{Cloud (AWS):} Lambda, Kinesis, Fargate/ECS, EventBridge, CDK (IaC), CloudWatch, Bedrock, EC2, Redshift'
  - '\textbf{Backend \& Data:} PostgreSQL, Redis, SQLAlchemy, Prisma, OpenSearch, B+ tree / LSM storage'
  - '\textbf{DevOps \& Tools:} Docker, GitHub Actions (CI/CD), Linux, perf, Pytest, Jest, uv'
  - '\textbf{Certification:} \href{https://www.credly.com/badges/d2406a97-d937-47de-823b-724981159d3b/public_url}{\underline{AWS Certified Developer -- Associate}} (Nov 2024 -- Nov 2027)'
